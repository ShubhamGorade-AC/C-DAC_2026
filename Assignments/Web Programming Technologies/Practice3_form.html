<html>
    <head>
        <title>Form</title>
    </head>

    <body>
        <form action="https://www.google.com/?zx=1792950737817" method="get">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name">
            <br><br>

            <label>Password</label>
            <input type="password" placeholder="Enter Password">
            <br><br>

            <label>DOB:</label>
            <input type="date">
            <br><br

            <label>Time:</label>
            <input type="time">
            <br><br>

            <label>Date Time</label>
            <input type="datetime-local">
            <br><br>

            <textarea placeholder="Enter full adress"></textarea>
            <br><br>

            <input type="checkbox"> <label>I Accepted terms and Conditions</label>
            <br><br>

            <button type="button">Click Me</button>
            <br><br>
            <button type="submit">Register</button>
            <br><br>
            <button type="reset">Clear Form</button>

        </form>
    </body>
</html>
