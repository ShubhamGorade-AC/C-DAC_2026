<html>
    <head>
        <title>Login Form</title>
        <link rel="stylesheet" type="text/css" href="styleform.css">
    </head>

    <body>
        <div id="logincontainer">
            <h2 id="loginheading">Login</h2>

            <form>
                <div>
                    <input type="text" placeholder="Enter Username" class="forminput">
                </div>

                <div>
                    <input type="password" placeholder="Enter Password" class="forminput">
                </div>

                <div>
                    <button type="submit" id="formbutton">Login</button>
                </div>
            </form>

            <p>Need Account ?<a href="#" id="formsignup"> Sign Up</a></p>

        </div>

    </body>
</html>
